# Deploy to Render: connect repo, set Root Directory to "linkedin-agent", add env vars in dashboard
services:
  - type: web
    name: linkedin-agent
    runtime: node
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: linkedin-agent-db
          property: connectionString

databases:
  - name: linkedin-agent-db
    plan: free
